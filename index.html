<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>India Fashions | Handcrafted Sarees & Royal Heritage Weaves</title>
    <meta name="description" content="Discover India Fashions' exquisite collection of authentic handcrafted sarees, Kanjivaram silk, Banarasi brocades, and festive royal heritage edits." />
    <!-- Google Fonts for Royal Heritage Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = `
              <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A3B35;color:#FAF7F2;font-family:sans-serif;padding:24px;text-align:center;">
                <div style="max-width:540px;background:#072A26;padding:36px;border-radius:16px;border:1px solid #D4AF37;box-shadow:0 12px 36px rgba(0,0,0,0.5);">
                  <div style="font-size:48px;margin-bottom:12px;">👑</div>
                  <h2 style="color:#E5C158;font-size:24px;margin:0 0 14px 0;">India Fashions Web App</h2>
                  <p style="color:#FAF7F2;line-height:1.6;font-size:15px;margin-bottom:20px;">
                    Yeh React web application <strong>Local Server</strong> par chalti hy. File directly double-click karne par browser security (CORS) ki wajah se scripts block kar deta hy.
                  </p>
                  <div style="background:rgba(212,175,55,0.1);padding:14px;border-radius:8px;border:1px dashed #D4AF37;margin-bottom:24px;text-align:left;font-size:14px;">
                    <p style="margin:0 0 8px 0;font-weight:600;color:#E5C158;">👉 Website Open Karne Ka Tareeqa:</p>
                    <p style="margin:6px 0;">1. Apne folder me <strong>Start-Website.bat</strong> file par double click karein, YA</p>
                    <p style="margin:6px 0;">2. Niche diye gaye link par click karein:</p>
                  </div>
                  <a href="http://localhost:5173" style="display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#D4AF37,#AA820A);color:#072A26;font-weight:700;text-decoration:none;border-radius:30px;">
                    Open http://localhost:5173 ➔
                  </a>
                </div>
              </div>
            `;
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

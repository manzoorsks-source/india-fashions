<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>India Fashions | Handcrafted Sarees & Royal Heritage Weaves</title>
    <meta name="description" content="Discover India Fashions' exquisite collection of authentic handcrafted sarees, Kanjivaram silk, Banarasi brocades, and festive royal heritage edits." />
    <!-- Google Fonts for Royal Heritage Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function() {
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = `
              <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A3B35;color:#FAF7F2;font-family:'Plus Jakarta Sans',sans-serif;padding:24px;text-align:center;">
                <div style="max-width:560px;background:#072A26;padding:36px;border-radius:16px;border:1px solid #D4AF37;box-shadow:0 12px 36px rgba(0,0,0,0.5);">
                  <div style="font-size:48px;margin-bottom:8px;">👑</div>
                  <h2 style="color:#E5C158;font-family:'Cinzel',serif;font-size:24px;margin:0 0 10px 0;">India Fashions Web App</h2>
                  
                  <div id="server-status" style="display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600;margin-bottom:18px;background:rgba(234,179,8,0.15);color:#FDE047;border:1px solid #EAB308;">
                    <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#EAB308;animation:pulse 1.5s infinite;"></span>
                    Server check ho raha hai...
                  </div>

                  <p id="desc-text" style="color:#E2E8F0;line-height:1.6;font-size:14px;margin-bottom:20px;">
                    Yeh React web application Node.js local server par chalti hai. Agar server start nahi hua toh <em>"localhost refused to connect"</em> error aata hai.
                  </p>

                  <div id="instructions" style="background:rgba(212,175,55,0.08);padding:16px;border-radius:10px;border:1px dashed #D4AF37;margin-bottom:22px;text-align:left;font-size:13.5px;line-height:1.6;">
                    <p style="margin:0 0 6px 0;font-weight:700;color:#E5C158;">👉 Website Start Karne Ka Tareeqa:</p>
                    <p style="margin:4px 0;">1. Apne folder me <strong>Start-Website.bat</strong> file par double-click karein.</p>
                    <p style="margin:4px 0;">2. Server start hote hi website automatically browser me khul jayegi, ya aap niche diye yellow button par click karein.</p>
                  </div>

                  <a id="open-btn" href="http://localhost:5173" style="display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#D4AF37,#AA820A);color:#072A26;font-weight:700;font-size:15px;text-decoration:none;border-radius:30px;box-shadow:0 4px 15px rgba(212,175,55,0.3);transition:transform 0.2s;">
                    Open http://localhost:5173 ➔
                  </a>
                  <p id="auto-note" style="margin-top:12px;font-size:12px;color:#94A3B8;"></p>
                </div>
              </div>
            `;

            // Live status checker
            function checkServer() {
              fetch('http://localhost:5173/api/health', { method: 'GET', mode: 'cors' })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                  var badge = document.getElementById('server-status');
                  var btn = document.getElementById('open-btn');
                  var note = document.getElementById('auto-note');
                  if (badge && btn) {
                    badge.innerHTML = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#22C55E;"></span> 🟢 Server Live & Ready!';
                    badge.style.background = 'rgba(34,197,94,0.15)';
                    badge.style.color = '#4ADE80';
                    badge.style.border = '1px solid #22C55E';
                    btn.style.background = 'linear-gradient(135deg,#22C55E,#16A34A)';
                    btn.style.color = '#FFFFFF';
                    btn.innerText = 'Go to Live Website ➔';
                    if (note && !note.dataset.redirecting) {
                      note.dataset.redirecting = 'true';
                      note.innerText = 'Server active hai! 2 seconds me website open ho rahi hai...';
                      setTimeout(function() {
                        window.location.href = 'http://localhost:5173';
                      }, 2000);
                    }
                  }
                })
                .catch(function() {
                  var badge = document.getElementById('server-status');
                  if (badge) {
                    badge.innerHTML = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#EF4444;"></span> 🔴 Server Band Hai (Start-Website.bat chalayein)';
                    badge.style.background = 'rgba(239,68,68,0.15)';
                    badge.style.color = '#F87171';
                    badge.style.border = '1px solid #EF4444';
                  }
                });
            }

            checkServer();
            setInterval(checkServer, 2000);
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
